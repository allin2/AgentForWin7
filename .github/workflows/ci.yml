name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # docs:check reads historical commits and candidate tags, so it needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check_docs.mjs

  test:
    name: Daily tests (macOS)
    # Tests assume a case-insensitive filesystem like Windows and the macOS development machine.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/*/package-lock.json
            src/shell/office-lite/package-lock.json
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'src/shell/package-lock.json') }}
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in . src/core src/gateway src/git-adapter src/runner src/shell src/shell/office-lite src/state src/workspace; do
            # Retry once: the Electron postinstall download is occasionally aborted by the server.
            npm ci --prefix "$package" --no-audit --no-fund || npm ci --prefix "$package" --no-audit --no-fund
          done
      - name: Match the development host shell set
        # GitHub macOS images ship PowerShell Core; the development machine does not.
        # With pwsh on PATH the runner picks it as the default shell, a development-only
        # substitute that is not Win7 evidence, and the POSIX shell tests fail.
        shell: bash
        run: |
          if command -v pwsh >/dev/null; then sudo rm -f "$(command -v pwsh)"; fi
          if command -v pwsh >/dev/null; then echo "pwsh is still on PATH" >&2; exit 1; fi
      - name: Daily test set
        run: npm run test:local

  test-windows:
    name: Daily tests (Windows; runner, workspace, git-adapter)
    # Windows Server is not Win7 evidence. It catches win32 paths, encodings, cmd.exe and
    # Windows PowerShell 5.1 selection, and process handling before a Win7 window is spent.
    # These modules need neither Electron nor the root better-sqlite3 build; the others do.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Keep the checkout byte-identical to the macOS job
        # Git for Windows on hosted runners defaults to core.autocrlf=true, which would rewrite
        # LF sources and fixtures to CRLF; .gitattributes still applies to *.bat.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/runner/package-lock.json
            src/workspace/package-lock.json
            src/git-adapter/package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in src/runner src/workspace src/git-adapter; do
            npm ci --prefix "$package" --no-audit --no-fund
          done
      - name: Daily test set (Windows modules)
        run: npm run test:local -- --module runner --module workspace --module git-adapter
