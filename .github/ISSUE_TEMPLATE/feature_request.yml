name: 功能建议 / Feature request
description: 提出新功能或改进建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前在什么场景下遇到了什么困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Win7 环境限制
      description: 是否涉及新的运行时、原生模块、系统权限或网络访问。没有可留空。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
